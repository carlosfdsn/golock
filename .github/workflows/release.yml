name: Release

# Cria os executáveis de Windows, Linux e macOS e publica em "Releases"
# sempre que você enviar uma tag que comece com "v" (ex.: v0.2.0).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: windows-amd64
            flags: ""
          - os: ubuntu-latest
            alvo: linux-amd64
            flags: "-tags webkit2_41"
          - os: macos-latest
            alvo: macos-universal
            flags: "-platform darwin/universal"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências do Linux (GTK + WebKit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Instalar o Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compilar
        run: wails build -clean ${{ matrix.flags }}

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pacote | Out-Null
          Copy-Item build/bin/*.exe pacote/GoLock-windows-amd64.exe

      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pacote
          tar -czf pacote/GoLock-linux-amd64.tar.gz -C build/bin .

      - name: Empacotar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p pacote
          ditto -c -k --sequesterRsrc --keepParent build/bin/*.app pacote/GoLock-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: golock-${{ matrix.alvo }}
          path: pacote/*

  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Somas SHA-256
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true